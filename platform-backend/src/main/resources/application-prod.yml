# 生产 / Compose 专用（SPRING_PROFILES_ACTIVE=prod）
# 本地开发继续用 application-dev.yml + local.env，互不影响

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_city}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:smart_city}
    password: ${MYSQL_PASSWORD:smart_city}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.chengde.smartcity: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-use-256bit-secret-key-here}
  security:
    credential-key: ${CREDENTIAL_KEY:chengde-smartcity-credential-key}
  integration:
    enabled: ${INTEGRATION_ENABLED:true}
    demo-fallback: ${INTEGRATION_DEMO_FALLBACK:false}
    om:
      url: ${OM_URL:http://openmetadata:8585/api/v1}
      user: ${OM_USER:admin@open-metadata.org}
      password: ${OM_PASSWORD:admin}
    de:
      url: ${DE_URL:http://dataease:8100}
      embed-base: ${DE_EMBED_BASE:http://localhost/de}
    ds:
      url: ${DS_URL:http://dolphinscheduler:12345/dolphinscheduler}
      user: ${DS_USER:admin}
      password: ${DS_PASSWORD:dolphinscheduler123}
      token: ${DS_TOKEN:}
      tenant-code: ${DS_TENANT:default}
    kettle:
      url: ${KETTLE_URL:http://kettle-carte:8080}
      user: ${KETTLE_USER:cluster}
      password: ${KETTLE_PASSWORD:cluster}
      target-host: ${KETTLE_TARGET_HOST:mysql}
      target-port: ${KETTLE_TARGET_PORT:3306}
      target-database: ${KETTLE_TARGET_DB:smart_city_ods}
      target-user: ${KETTLE_TARGET_USER:smart_city}
      target-password: ${KETTLE_TARGET_PASSWORD:${MYSQL_PASSWORD:smart_city}}
      carte-host: ${KETTLE_CARTE_HOST:kettle-carte}
      carte-port: ${KETTLE_CARTE_PORT:8080}
    storage:
      es-url: ${ES_URL:http://oss-elasticsearch:9200}
      seaweed-s3-endpoint: ${SEAWEED_S3_ENDPOINT:http://seaweedfs:8333}
      seaweed-bucket: ${SEAWEED_S3_BUCKET:smartcity-docs}
      mongo-url: ${MONGO_URL:mongodb://mongodb:27017}
      canal-url: ${CANAL_URL:http://canal:11111}
