# 生产 / Compose 专用（SPRING_PROFILES_ACTIVE=prod）
# 本地开发继续用 application-dev.yml + local.env，互不影响

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_city}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:smart_city}
    password: ${MYSQL_PASSWORD:smart_city}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.chengde.smartcity: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-use-256bit-secret-key-here}
  security:
    credential-key: ${CREDENTIAL_KEY:chengde-smartcity-credential-key}
  upload:
    dir: ${APP_UPLOAD_DIR:/data/uploads}
  lifecycle:
    archive-dir: ${APP_ARCHIVE_DIR:/data/archives}
    archive-host-dir: ${ARCHIVE_HOST_DIR:/data/smart-city/archives}
  portal-sso:
    enabled: ${PORTAL_SSO_ENABLED:true}
    secret: ${PORTAL_SSO_SECRET:chengde-portal-assessment-sso-shared-secret-2026}
    ticket-ttl-seconds: ${PORTAL_SSO_TTL_SECONDS:60}
  integration:
    enabled: ${INTEGRATION_ENABLED:true}
    demo-fallback: ${INTEGRATION_DEMO_FALLBACK:false}
    om:
      url: ${OM_URL:http://openmetadata:8585/api/v1}
      user: ${OM_USER:admin@open-metadata.org}
      password: ${OM_PASSWORD:admin}
    de:
      url: ${DE_URL:http://dataease:8100}
      embed-base: ${DE_EMBED_BASE:http://localhost/de}
    ds:
      url: ${DS_URL:http://dolphinscheduler:12345/dolphinscheduler}
      ui-base: ${DS_UI_BASE:http://10.10.10.51:12345/dolphinscheduler}
      user: ${DS_USER:admin}
      password: ${DS_PASSWORD:dolphinscheduler123}
      token: ${DS_TOKEN:}
      tenant-code: ${DS_TENANT:default}
      callback-base-url: ${DS_CALLBACK_BASE_URL:http://10.10.10.57:8080}
      callback-token: ${DS_CALLBACK_TOKEN:}
    kettle:
      url: ${KETTLE_URL:http://kettle-carte:8080}
      user: ${KETTLE_USER:cluster}
      password: ${KETTLE_PASSWORD:cluster}
      target-host: ${KETTLE_TARGET_HOST:mysql}
      target-port: ${KETTLE_TARGET_PORT:3306}
      target-database: ${KETTLE_TARGET_DB:smart_city_ods}
      target-user: ${KETTLE_TARGET_USER:smart_city}
      target-password: ${KETTLE_TARGET_PASSWORD:${MYSQL_PASSWORD:smart_city}}
      carte-host: ${KETTLE_CARTE_HOST:kettle-carte}
      carte-port: ${KETTLE_CARTE_PORT:8080}
    esb:
      base-url: ${ESB_SMC_BASE:http://10.10.10.61:7000}
      app-code: ${ESB_APP_CODE:ESB}
      app-pwd: "${ESB_APP_PWD:encrypt-S214ejBpeFJjcFNlRFpqRnlpWWFCUnhJUFkrclRTYUczU1Z2WldHeUZnLzBjamRab09Vd0YzblorYVA2MG9aMzhjUHlaZ3Q1NjVSdkRoUE55ZDhGNE1uMGJQUGYxYU1LVGhMVVd1NVB4NDFpb2l0dVRZNUFBUjY5NzNPaDg0Y1l5WG9VbmlQZndqbUIyMlNqOFlaZnFTRzRyNnB5MjBtakp2NWZRTXNoN2VnPQ==}"
      gateway-base: ${ESB_GATEWAY_BASE:}
      connect-timeout-ms: ${ESB_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ESB_READ_TIMEOUT_MS:10000}
      db-config-id: ${ESB_DB_CONFIG_ID:}
      customer-id: ${ESB_CUSTOMER_ID:esb}
      server-name: ${ESB_SERVER_NAME:esb}
      online-base-path: ${ESB_ONLINE_BASE_PATH:http://localhost:9090/}
      api-name: ${ESB_API_NAME:esb}
      source-name: ${ESB_SOURCE_NAME:esb}
      online-method: ${ESB_ONLINE_METHOD:get}
    storage:
      es-url: ${ES_URL:http://oss-elasticsearch:9200}
      seaweed-s3-endpoint: ${SEAWEED_S3_ENDPOINT:http://seaweedfs:8333}
      seaweed-bucket: ${SEAWEED_S3_BUCKET:smartcity-docs}
      mongo-url: ${MONGO_URL:mongodb://mongodb:27017}
      canal-url: ${CANAL_URL:http://canal:11111}
  # 方案 B：分层库可分机。host 留空则 LayerJdbcSupport 回落 kettle.target-* / MYSQL（方案 A）
  data-layer:
    ods:
      host: ${LAYER_ODS_HOST:}
      port: ${LAYER_ODS_PORT:0}
      username: ${LAYER_ODS_USER:}
      password: ${LAYER_ODS_PASSWORD:}
    dwd:
      host: ${LAYER_DWD_HOST:}
      port: ${LAYER_DWD_PORT:0}
      username: ${LAYER_DWD_USER:}
      password: ${LAYER_DWD_PASSWORD:}
    dws:
      host: ${LAYER_DWS_HOST:}
      port: ${LAYER_DWS_PORT:0}
      username: ${LAYER_DWS_USER:}
      password: ${LAYER_DWS_PASSWORD:}
    ads:
      host: ${LAYER_ADS_HOST:}
      port: ${LAYER_ADS_PORT:0}
      username: ${LAYER_ADS_USER:}
      password: ${LAYER_ADS_PASSWORD:}
  # 指标结果库：任务执行（手动/DS）时按指标域库名幂等建库建表并落数
  indicator-db:
    host: ${INDICATOR_DB_HOST:10.10.10.12}
    port: ${INDICATOR_DB_PORT:13306}
    username: ${INDICATOR_DB_USER:root}
    password: ${INDICATOR_DB_PASSWORD:}
