spring:
  config:
    import: optional:file:../local.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_city}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    com.chengde.smartcity: DEBUG

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./data/uploads}
  security:
    credential-key: ${CREDENTIAL_KEY:chengde-smartcity-credential-key}
  lifecycle:
    archive-dir: ${APP_ARCHIVE_DIR:data/archives}
    archive-host-dir: ${ARCHIVE_HOST_DIR:}
  portal-sso:
    enabled: ${PORTAL_SSO_ENABLED:true}
    secret: ${PORTAL_SSO_SECRET:chengde-portal-assessment-sso-shared-secret-2026}
    ticket-ttl-seconds: ${PORTAL_SSO_TTL_SECONDS:60}
  integration:
    enabled: ${INTEGRATION_ENABLED:true}
    demo-fallback: ${INTEGRATION_DEMO_FALLBACK:false}
    om:
      url: ${OM_URL:http://localhost:8585/api/v1}
      user: ${OM_USER:admin@open-metadata.org}
      password: ${OM_PASSWORD:admin}
    de:
      url: ${DE_URL:http://localhost:8100}
      embed-base: ${DE_EMBED_BASE:http://localhost:8100}
    ds:
      url: ${DS_URL:http://localhost:12345/dolphinscheduler}
      ui-base: ${DS_UI_BASE:}
      user: ${DS_USER:admin}
      password: ${DS_PASSWORD:dolphinscheduler123}
      token: ${DS_TOKEN:}
      tenant-code: ${DS_TENANT:default}
      callback-base-url: ${DS_CALLBACK_BASE_URL:http://host.docker.internal:9090}
      callback-token: ${DS_CALLBACK_TOKEN:}
    kettle:
      # 宿主端口 18081（Windows 保留了 8081–8180）；可用环境变量覆盖
      url: ${KETTLE_URL:http\://localhost\:18081}
      user: ${KETTLE_USER:cluster}
      password: ${KETTLE_PASSWORD:cluster}
      # Carte 容器写入 ODS 时的默认提示地址；后端 JVM 连分层库走 spring.datasource，
      # KTR 内目标机会再经 host-map 把 localhost 译为 host.docker.internal
      target-host: ${KETTLE_TARGET_HOST:host.docker.internal}
      target-port: ${KETTLE_TARGET_PORT:3306}
      target-database: ${KETTLE_TARGET_DB:smart_city_ods}
      target-user: ${KETTLE_TARGET_USER:root}
      target-password: ${KETTLE_TARGET_PASSWORD:${MYSQL_PASSWORD:}}
      # DS SHELL 节点在容器网内访问 Carte 的地址
      carte-host: ${KETTLE_CARTE_HOST:kettle-carte}
      carte-port: ${KETTLE_CARTE_PORT:8080}
      # 源库 host:port -> Carte 可达 host:port
      # 3308：compose source-mysql；3306：宿主机 MySQL（容器内须走 host.docker.internal）
      host-map:
        "localhost:3308": source-mysql:3306
        "127.0.0.1:3308": source-mysql:3306
        "localhost:3306": host.docker.internal:3306
        "127.0.0.1:3306": host.docker.internal:3306
    esb:
      base-url: ${ESB_SMC_BASE:http://10.216.131.100:7000}
      app-code: ${ESB_APP_CODE:ESB}
      app-pwd: "${ESB_APP_PWD:encrypt-S214ejBpeFJjcFNlRFpqRnlpWWFCUnhJUFkrclRTYUczU1Z2WldHeUZnLzBjamRab09Vd0YzblorYVA2MG9aMzhjUHlaZ3Q1NjVSdkRoUE55ZDhGNE1uMGJQUGYxYU1LVGhMVVd1NVB4NDFpb2l0dVRZNUFBUjY5NzNPaDg0Y1l5WG9VbmlQZndqbUIyMlNqOFlaZnFTRzRyNnB5MjBtakp2NWZRTXNoN2VnPQ==}"
      gateway-base: ${ESB_GATEWAY_BASE:}
      connect-timeout-ms: ${ESB_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${ESB_READ_TIMEOUT_MS:10000}
      db-config-id: ${ESB_DB_CONFIG_ID:}
      customer-id: ${ESB_CUSTOMER_ID:esb}
      server-name: ${ESB_SERVER_NAME:esb}
      online-base-path: ${ESB_ONLINE_BASE_PATH:http://localhost:9090/}
      api-name: ${ESB_API_NAME:esb}
      source-name: ${ESB_SOURCE_NAME:esb}
      online-method: ${ESB_ONLINE_METHOD:get}
    storage:
      es-url: ${ES_URL:http://localhost:9200}
      seaweed-s3-endpoint: ${SEAWEED_S3_ENDPOINT:http://localhost:8333}
      seaweed-bucket: ${SEAWEED_S3_BUCKET:smartcity-docs}
      mongo-url: ${MONGO_URL:mongodb://localhost:27017}
      canal-url: ${CANAL_URL:http://localhost:19090}
  # 指标结果库（任务执行时建库建表）；本地默认本机 MySQL
  indicator-db:
    host: ${INDICATOR_DB_HOST:127.0.0.1}
    port: ${INDICATOR_DB_PORT:3306}
    username: ${INDICATOR_DB_USER:root}
    password: ${INDICATOR_DB_PASSWORD:${MYSQL_PASSWORD:}}
