name: smart-city-ms1

services:
  mysql:
    image: mysql:8.0
    container_name: smart_city_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_city
      MYSQL_USER: smart_city
      MYSQL_PASSWORD: smart_city
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - smart_city_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: smart_city_redis
    ports:
      - "6379:6379"

volumes:
  smart_city_mysql_data:
