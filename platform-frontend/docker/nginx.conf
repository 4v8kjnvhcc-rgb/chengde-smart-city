server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 门户规范入口：无尾斜杠 /bigdata-web（带斜杠的入口统一去掉）
    location = / {
        return 302 /bigdata-web;
    }
    location = /bigdata-web/ {
        # 容器内 listen 80，绝对跳转会丢对外 9087；用客户端 Host 保留端口
        return 301 $scheme://$http_host/bigdata-web$is_args$args;
    }
    location = /bigdata-web {
        rewrite ^ /bigdata-web/index.html last;
    }

    # 静态资源与 SPA 子路由：/bigdata-web/login、/bigdata-web/assets/...
    location /bigdata-web/ {
        try_files $uri $uri/ /bigdata-web/index.html;
    }

    # API 仍挂在站点根路径 /api/（与前端 axios baseURL=/api/v1 一致）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
    }
}
