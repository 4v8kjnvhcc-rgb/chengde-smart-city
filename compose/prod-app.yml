# 应用机 10.10.10.57：仅 web + backend（连 10.10.10.51 中间件 + 分层库机）
# 用法（在 .57 上）:
#   cp compose/prod-app.env.example compose/prod-app.env
#   docker compose -f compose/prod-app.yml --env-file compose/prod-app.env up -d
#
# 门户入口：http://10.10.10.57:9087/bigdata-web
# 本地开发：http://127.0.0.1:9087/bigdata-web

name: smart-city-app

services:
  backend:
    build:
      context: ../platform-backend
      dockerfile: Dockerfile
    image: smart-city/platform-backend:local
    container_name: sc_app_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      MYSQL_HOST: ${MYSQL_HOST:-10.10.10.51}
      MYSQL_PORT: ${MYSQL_PORT:-13306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_city}
      MYSQL_USER: ${MYSQL_USER:-smart_city}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-10.10.10.51}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-chengde-smartcity-credential-key}
      INTEGRATION_ENABLED: ${INTEGRATION_ENABLED:-true}
      INTEGRATION_DEMO_FALLBACK: "false"
      OM_URL: ${OM_URL:-http://10.10.10.51:8585/api/v1}
      OM_USER: ${OM_USER:-admin@openmetadata.org}
      OM_PASSWORD: ${OM_PASSWORD:-admin}
      DE_URL: ${DE_URL:-http://10.10.10.51:8100}
      DE_EMBED_BASE: ${DE_EMBED_BASE:-http://10.10.10.57:9087}
      DS_URL: ${DS_URL:-http://10.10.10.51:12345/dolphinscheduler}
      DS_USER: ${DS_USER:-admin}
      DS_PASSWORD: ${DS_PASSWORD:-dolphinscheduler123}
      KETTLE_URL: ${KETTLE_URL:-http://10.10.10.51:18081}
      KETTLE_USER: ${KETTLE_USER:-cluster}
      KETTLE_PASSWORD: ${KETTLE_PASSWORD:-cluster}
      KETTLE_TARGET_HOST: ${KETTLE_TARGET_HOST:-10.10.10.51}
      KETTLE_TARGET_PORT: ${KETTLE_TARGET_PORT:-13306}
      KETTLE_TARGET_DB: ${KETTLE_TARGET_DB:-smart_city_ods}
      KETTLE_TARGET_USER: ${KETTLE_TARGET_USER:-smart_city}
      KETTLE_TARGET_PASSWORD: ${KETTLE_TARGET_PASSWORD:-}
      # 方案 B：S6 原始治理库 / S7 基础主题库（未设则回落 KETTLE_TARGET_*，等同方案 A）
      LAYER_ODS_HOST: ${LAYER_ODS_HOST:-}
      LAYER_ODS_PORT: ${LAYER_ODS_PORT:-0}
      LAYER_ODS_USER: ${LAYER_ODS_USER:-}
      LAYER_ODS_PASSWORD: ${LAYER_ODS_PASSWORD:-}
      LAYER_DWD_HOST: ${LAYER_DWD_HOST:-}
      LAYER_DWD_PORT: ${LAYER_DWD_PORT:-0}
      LAYER_DWD_USER: ${LAYER_DWD_USER:-}
      LAYER_DWD_PASSWORD: ${LAYER_DWD_PASSWORD:-}
      LAYER_DWS_HOST: ${LAYER_DWS_HOST:-}
      LAYER_DWS_PORT: ${LAYER_DWS_PORT:-0}
      LAYER_DWS_USER: ${LAYER_DWS_USER:-}
      LAYER_DWS_PASSWORD: ${LAYER_DWS_PASSWORD:-}
      LAYER_ADS_HOST: ${LAYER_ADS_HOST:-}
      LAYER_ADS_PORT: ${LAYER_ADS_PORT:-0}
      LAYER_ADS_USER: ${LAYER_ADS_USER:-}
      LAYER_ADS_PASSWORD: ${LAYER_ADS_PASSWORD:-}
      # 指标结果库（.12）；任务执行时按指标域库名建库建表
      INDICATOR_DB_HOST: ${INDICATOR_DB_HOST:-10.10.10.12}
      INDICATOR_DB_PORT: ${INDICATOR_DB_PORT:-13306}
      INDICATOR_DB_USER: ${INDICATOR_DB_USER:-root}
      INDICATOR_DB_PASSWORD: ${INDICATOR_DB_PASSWORD:-}
      DS_CALLBACK_BASE_URL: ${DS_CALLBACK_BASE_URL:-http://10.10.10.57:8080}
      KETTLE_CARTE_HOST: ${KETTLE_CARTE_HOST:-10.10.10.51}
      KETTLE_CARTE_PORT: ${KETTLE_CARTE_PORT:-18081}
      ES_URL: ${ES_URL:-http://10.10.10.51:9200}
      SEAWEED_S3_ENDPOINT: ${SEAWEED_S3_ENDPOINT:-http://10.10.10.51:8333}
      SEAWEED_S3_BUCKET: ${SEAWEED_S3_BUCKET:-smartcity-docs}
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.51:27017}
      CANAL_URL: ${CANAL_URL:-http://10.10.10.51:19090}
      ESB_SMC_BASE: ${ESB_SMC_BASE:-http://10.10.10.61:7000}
      ESB_APP_CODE: ${ESB_APP_CODE:-ESB}
      ESB_APP_PWD: "${ESB_APP_PWD:-encrypt-S214ejBpeFJjcFNlRFpqRnlpWWFCUnhJUFkrclRTYUczU1Z2WldHeUZnLzBjamRab09Vd0YzblorYVA2MG9aMzhjUHlaZ3Q1NjVSdkRoUE55ZDhGNE1uMGJQUGYxYU1LVGhMVVd1NVB4NDFpb2l0dVRZNUFBUjY5NzNPaDg0Y1l5WG9VbmlQZndqbUIyMlNqOFlaZnFTRzRyNnB5MjBtakp2NWZRTXNoN2VnPQ==}"
      ESB_GATEWAY_BASE: ${ESB_GATEWAY_BASE:-}
      ESB_DB_CONFIG_ID: ${ESB_DB_CONFIG_ID:-}
      ESB_CUSTOMER_ID: ${ESB_CUSTOMER_ID:-esb}
      ESB_SERVER_NAME: ${ESB_SERVER_NAME:-esb}
      ESB_ONLINE_BASE_PATH: ${ESB_ONLINE_BASE_PATH:-http://localhost:9090/}
      ESB_API_NAME: ${ESB_API_NAME:-esb}
      ESB_SOURCE_NAME: ${ESB_SOURCE_NAME:-esb}
      ESB_ONLINE_METHOD: ${ESB_ONLINE_METHOD:-get}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms1g -Xmx3g}
      # 容器内路径；必须与下方宿主机绑定挂载目标一致
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/data/uploads}
      APP_ARCHIVE_DIR: ${APP_ARCHIVE_DIR:-/data/archives}
      ARCHIVE_HOST_DIR: ${ARCHIVE_HOST_DIR:-/data/smart-city/archives}
    ports:
      - "${BACKEND_PUBLISH_PORT:-8080}:8080"
    volumes:
      # 宿主机磁盘永久落盘（勿用仅容器内路径；重建容器不丢文件）
      # .57 上先 mkdir，并 chown 10001:10001（backend USER appuser，非 root）
      # mkdir -p /data/smart-city/uploads /data/smart-city/archives
      # chown 10001:10001 /data/smart-city/uploads /data/smart-city/archives
      - ${UPLOAD_HOST_DIR:-/data/smart-city/uploads}:/data/uploads
      # 归档文件落宿主机盘（勿写容器可写层）
      - ${ARCHIVE_HOST_DIR:-/data/smart-city/archives}:/data/archives
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 180s

  web:
    build:
      context: ../platform-frontend
      dockerfile: Dockerfile
    image: smart-city/platform-frontend:local
    container_name: sc_app_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 门户：http://10.10.10.57:9087/bigdata-web
      - "${WEB_PUBLISH_PORT:-9087}:80"
